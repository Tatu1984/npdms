version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: npdms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: npdms
      POSTGRES_PASSWORD: npdms_secret_2024
      POSTGRES_DB: npdms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npdms -d npdms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: npdms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for file storage (evidence photos, documents)
  minio:
    image: minio/minio:latest
    container_name: npdms-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: npdms_admin
      MINIO_ROOT_PASSWORD: npdms_minio_secret_2024
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # API Gateway (Go backend)
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: npdms-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://npdms:npdms_secret_2024@postgres:5432/npdms?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=npdms_admin
      - MINIO_SECRET_KEY=npdms_minio_secret_2024
      - JWT_SECRET=${JWT_SECRET:-npdms_jwt_secret_key_change_in_production}
      - ML_FIR_CLASSIFIER_URL=http://ml-fir-classifier:8001
      - ML_SEMANTIC_SEARCH_URL=http://ml-semantic-search:8002
      - ML_CRIME_PREDICTION_URL=http://ml-crime-prediction:8003
      - PORT=8080
      - ENV=development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    profiles:
      - full

  # ML Service: FIR Classifier
  ml-fir-classifier:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
      target: fir_classifier
    container_name: npdms-ml-fir-classifier
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/cache
    volumes:
      - ml_models_cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - ml
      - full

  # ML Service: Semantic Search
  ml-semantic-search:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
      target: semantic_search
    container_name: npdms-ml-semantic-search
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - SENTENCE_TRANSFORMERS_HOME=/app/cache
    volumes:
      - ml_models_cache:/app/cache
      - ml_faiss_index:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - ml
      - full

  # ML Service: Crime Prediction
  ml-crime-prediction:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
      target: crime_prediction
    container_name: npdms-ml-crime-prediction
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - ml
      - full

  # Monitoring: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: npdms-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring
      - full

  # Monitoring: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: npdms-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    profiles:
      - monitoring
      - full

  # Monitoring: PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: npdms-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://npdms:npdms_secret_2024@postgres:5432/npdms?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    profiles:
      - monitoring
      - full

  # Monitoring: Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: npdms-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    profiles:
      - monitoring
      - full

  # Monitoring: Node Exporter (System Metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: npdms-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    profiles:
      - monitoring
      - full

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ml_models_cache:
  ml_faiss_index:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: npdms-network
